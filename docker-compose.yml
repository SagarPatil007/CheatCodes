services:
  backend:
    build:
      context: ./CheatCode-api
      dockerfile: Dockerfile
    pull_policy: build
    image: cheatcode-api:latest
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      DOCS_PATH: ${DOCS_PATH:-/app/docs}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    restart: unless-stopped

  frontend:
    build:
      context: ./CheatCode-web
      dockerfile: Dockerfile
    pull_policy: build
    image: cheatcode-web:latest
    environment:
      API_URL: ${API_URL:-http://backend:8080}
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped
